services:
  neo4j:
    image: neo4j:5.13-community
    container_name: cop-test-neo4j
    restart: unless-stopped
    ports:
      - "7474:7474"
      - "7687:7687"
    environment:
      # 必须由调用方提供, 不要把密码写入仓库.
      NEO4J_AUTH: ${NEO4J_AUTH:?set NEO4J_AUTH, e.g. neo4j/<password>}
    volumes:
      - cop-test-neo4j-data:/data
      - ./import:/import:ro

volumes:
  cop-test-neo4j-data:
    name: cop-test-neo4j-data
